<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#091319" />
      <stop offset="100%" stop-color="#020508" />
    </radialGradient>

    <!-- CB Text Gradient: Bright Cyan to Vibrant Emerald -->
    <linearGradient id="cbGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#10e7b2" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Glowing Rail Gradients matching user screenshot -->
    <linearGradient id="topPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="bottomPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="sideCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#00f2fe" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Dark Octagonal Badge with Chamfered Corners -->
  <path 
    d="M 38 6 L 90 6 Q 97 6 102 11 L 117 26 Q 122 31 122 38 L 122 90 Q 122 97 117 102 L 102 117 Q 97 122 90 122 L 38 122 Q 31 122 26 117 L 11 102 Q 6 97 6 90 L 6 38 Q 6 31 11 26 L 26 11 Q 31 6 38 6 Z" 
    fill="url(#cardBg)" 
    stroke="#102528" 
    stroke-width="3"
  />

  <!-- Neon Accent Rails from Screenshot -->
  <!-- Top Rail (Pink/Purple) -->
  <path d="M 40 6 L 88 6" stroke="url(#topPink)" stroke-width="7" stroke-linecap="round" />

  <!-- Bottom Rail (Purple/Pink) -->
  <path d="M 40 122 L 88 122" stroke="url(#bottomPurple)" stroke-width="7" stroke-linecap="round" />

  <!-- Left Rail (Cyan) -->
  <path d="M 6 40 L 6 88" stroke="url(#sideCyan)" stroke-width="7" stroke-linecap="round" />

  <!-- Right Rail (Cyan) -->
  <path d="M 122 40 L 122 88" stroke="url(#sideCyan)" stroke-width="7" stroke-linecap="round" />

  <!-- Corner Bevel Accent Dots/Lines -->
  <path d="M 17 21 L 24 14" stroke="#c084fc" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 104 14 L 111 21" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 111 107 L 104 114" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 24 114 L 17 107" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.75" />

  <!-- Bold "CB" Monogram Text -->
  <text 
    x="64" 
    y="83" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" 
    font-size="64" 
    font-weight="900" 
    letter-spacing="-2.5px"
    fill="url(#cbGrad)"
    filter="url(#softGlow)"
  >CB</text>
</svg>